name: docuconvert

services:
  # Production database
  postgres:
    image: postgres:16-alpine
    container_name: docuconvert-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docuconvert}
      POSTGRES_USER: ${POSTGRES_USER:-docuconvert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuconvert}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - docuconvert-network

  # Reserved for future shared rate limiting/caching. The app currently uses an
  # in-process limiter, so this service is optional infrastructure.
  redis:
    image: redis:7-alpine
    container_name: docuconvert-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - docuconvert-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuconvert-backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-docuconvert}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-docuconvert}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - STORAGE_DIR=/app/storage
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-200}
      - MAX_BATCH_SIZE_MB=${MAX_BATCH_SIZE_MB:-1024}
      - MAX_FILES_PER_JOB=${MAX_FILES_PER_JOB:-15}
      - RESULT_TTL_HOURS=${RESULT_TTL_HOURS:-24}
      - CLEANUP_INTERVAL_MINUTES=${CLEANUP_INTERVAL_MINUTES:-15}
      - CONVERSION_TIMEOUT_SECONDS=${CONVERSION_TIMEOUT_SECONDS:-300}
      - CONVERSION_WORKERS=${CONVERSION_WORKERS:-0}
      - ALLOW_ANONYMOUS=${ALLOW_ANONYMOUS:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://xconvert.com,https://www.xconvert.com}
      - LIBREOFFICE_PATH=/usr/bin/libreoffice
      - TESSERACT_CMD=/usr/bin/tesseract
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - docuconvert-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time; keep it in sync with .env.production.
        # Empty string = relative URLs (same-origin through nginx) — recommended.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
    container_name: docuconvert-frontend
    environment:
      # Runtime copy only; the client value is inlined at build time via the ARG above.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL-}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - docuconvert-network
    restart: unless-stopped

  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: docuconvert-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - docuconvert-network
    restart: unless-stopped

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot
    container_name: docuconvert-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    restart: unless-stopped
    networks:
      - docuconvert-network

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  docuconvert-network:
    driver: bridge